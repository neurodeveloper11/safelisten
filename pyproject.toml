[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safelisten"
version = "0.1.0"
description = "Auditoría de calidad y cumplimiento de conversaciones de call center y chatbots, con anonimización antes de salir de la empresa."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fabio Torres" }]
requires-python = ">=3.10"
dependencies = [
  # Librerías propias, fijadas a un commit para builds reproducibles.
  "alometro @ git+https://github.com/neurodeveloper11/alometro@971c852f6e50228f15e7bfb65614862a459c8000",
  "datashield-es @ git+https://github.com/neurodeveloper11/pii-shield-es@ba46cc8525abe07e8b0b872142cc923e2669774b",
]

[project.optional-dependencies]
warehouse = ["duckdb>=1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "duckdb>=1.0"]
gcp = ["google-cloud-bigquery>=3.20", "google-cloud-storage>=2.16"]
llm = ["anthropic>=0.70"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "dbt-duckdb>=1.8", "duckdb>=1.0",
       "uvicorn>=0.29", "google-cloud-bigquery>=3.20",
       "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
safelisten = "safelisten.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]  # B008: patrón de FastAPI (File/Depends)
